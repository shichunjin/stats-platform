# ============================================================
# 统计软件托管平台 - Guacamole Docker 部署
# 用途：通过浏览器远程访问 Windows 云主机上的统计软件
#
# 架构：浏览器 → guacamole(Web) → guacd(RDP 后端) → Windows 云主机 8.133.223.251
#
# 认证：PostgreSQL JDBC（官方 Docker 镜像不支持 user-mapping.xml 文件认证）
#
# 首次部署步骤：
#   1. 生成数据库初始化脚本 initdb.sql：
#        docker run --rm guacamole/guacamole:1.6.0 /opt/guacamole/bin/initdb.sh --postgresql > initdb.sql
#   2. cp .env.example .env 并填入 POSTGRES_PASSWORD
#   3. docker compose up -d
#   4. 默认管理员 guacadmin / guacadmin 登录，创建用户与 RDP 连接
# ============================================================

services:
  # RDP 后端守护进程（负责实际的 RDP 协议通信）
  guacd:
    image: guacamole/guacd:1.6.0
    restart: always
    volumes:
      - ./recordings:/var/log/guacamole/recordings

  # PostgreSQL 数据库（存储用户、连接、权限等）
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./db-data:/var/lib/postgresql/data
      # 首次启动时自动执行 initdb.sql 初始化 schema（需预先生成）
      - ./initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro

  # Guacamole Web 前端（浏览器访问入口）
  guacamole:
    image: guacamole/guacamole:1.6.0
    restart: always
    ports:
      - "8080:8080"
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: "4822"
      # PostgreSQL JDBC 认证
      POSTGRESQL_HOSTNAME: postgres
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_DATABASE: guacamole_db
      POSTGRESQL_USER: guacamole_user
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - guacd
      - postgres
