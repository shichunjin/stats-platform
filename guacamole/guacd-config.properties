# ============================================================
# Guacamole guacamole.properties 配置
# 放置位置: /etc/guacamole/guacamole.properties
# ============================================================

# --- 基本设置 ---
guacd-hostname: localhost
guacd-port: 4822

# --- 用户映射方式 (文件模式，生产环境建议用数据库) ---
user-mapping: /etc/guacamole/user-mapping.xml

# --- PostgreSQL 认证 (生产环境推荐) ---
# postgres-hostname: localhost
# postgres-port: 5432
# postgres-database: guacamole_db
# postgres-username: guacamole_user
# postgres-password: guacamole_password
# postgres-auto-create-accounts: true

# --- 会话录制 (可选) ---
recording-search-path: /var/log/guacamole/recordings
recording-name: ${GUAC_USERNAME}-${GUAC_DATE}-${GUAC_TIME}

# --- 默认连接参数 (禁用剪贴板/驱动器) ---
# 在 user-mapping.xml 中已逐连接禁用，这里作为全局默认
