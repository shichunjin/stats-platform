# ============================================================
# 统计软件托管平台 - Guacamole Nginx 反向代理配置
# 用途：将域名反向代理到 Guacamole 容器，并支持 HTTPS + WebSocket
#
# 放置位置：/etc/nginx/conf.d/guacamole.conf
#
# 关键点：
#   - Guacamole 的 WebSocket 隧道路径为 /guacamole/websocket-tunnel
#   - 必须正确升级 Connection/Upgrade 头，否则浏览器远程桌面无法工作
# ============================================================

# 上游：Guacamole 容器暴露的 8080 端口
upstream guacamole_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ---- HTTP 服务器（用于证书申请 / 跳转 HTTPS） ----
server {
    listen 80;
    listen [::]:80;
    server_name guac.chunjindevelop68.xyz;

    # ACME 证书验证路径（certbot webroot 方式）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 其余请求跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS 服务器（正式访问入口） ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name guac.chunjindevelop68.xyz;

    # SSL 证书（使用 certbot 申请后自动生成）
    ssl_certificate     /etc/letsencrypt/live/guac.chunjindevelop68.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guac.chunjindevelop68.xyz/privkey.pem;

    # 现代安全 SSL 配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # 请求体大小限制
    client_max_body_size 10m;

    # ---- 通用反向代理 ----
    location / {
        proxy_pass http://guacamole_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 关键：WebSocket 支持（Guacamole 远程桌面依赖）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置（远程桌面会话可能长时间保持）
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        # 关闭缓冲，保证实时画面
        proxy_buffering off;
    }
}
