# ============================================================
# 统计软件托管平台 - 主站 Nginx 反向代理配置
# 用途：将域名 chunjindevelop68.xyz 反向代理到 FastAPI(uvicorn) 8000 端口
#
# 放置位置：/etc/nginx/conf.d/stats-platform.conf
#
# 说明：
#   - 主站（含前端 dist 静态资源 + /api 接口）由 uvicorn 同源提供，
#     这里仅做 HTTPS 终结与反向代理。
#   - 数据筛选/导出可能上传较大文件，client_max_body_size 设为 50m。
# ============================================================

# 上游：FastAPI / uvicorn
upstream stats_platform_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ---- HTTP 服务器（证书申请 / 跳转 HTTPS） ----
server {
    listen 80;
    listen [::]:80;
    server_name chunjindevelop68.xyz;

    # ACME 证书验证路径（certbot webroot 方式）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 其余请求跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS 服务器（正式访问入口） ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chunjindevelop68.xyz;

    # SSL 证书（使用 certbot 申请后自动生成）
    ssl_certificate     /etc/letsencrypt/live/chunjindevelop68.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chunjindevelop68.xyz/privkey.pem;

    # 现代安全 SSL 配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 请求体大小限制（数据筛选/导出可能上传较大文件）
    client_max_body_size 50m;

    # ---- 反向代理到 uvicorn ----
    location / {
        proxy_pass http://stats_platform_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（保留以备后续实时功能使用）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置（大数据筛选可能耗时较长）
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
